p 6s cubic-bezier(.1,.4,.2,1) infinite 3s}.flow-line{stroke-dasharray:8 16;animation:particle-drift 12s linear infinite}</style></defs><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><circle cx="200" cy="90" r="130" fill="#0284c7" class="orb-1" filter="url(#neon-glow)"/><circle cx="1020" cy="330" r="150" fill="#7c3aed" class="orb-2" filter="url(#neon-glow)"/><path fill="none" stroke="#38bdf8" stroke-opacity=".3" stroke-width="1.8" d="M 0 350 Q 300 280 600 350 T 1200 320" class="flow-line"/><path fill="none" stroke="#818cf8" stroke-opacity=".25" stroke-width="1.8" d="M 0 80 Q 400 140 800 70 T 1200 110" class="flow-line"/><circle cx="1100" cy="100" r="50" fill="none" stroke="#38bdf8" stroke-width="1" class="pulse-ring"/><circle cx="1100" cy="100" r="50" fill="none" stroke="#a855f7" stroke-width="1" class="pulse-ring-delayed"/><g transform="translate(60, 48)"><rect width="280" height="34" x="0" y="0" fill="url(#badge-glow)" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="17"/><text x="140" y="22" fill="#38bdf8" class="tag-text" text-anchor="middle">⚡ CURATED DEVELOPER PLATFORM STACK</text><text x="0" y="92" fill="url(#title-grad)" class="title-text">Developer API &amp; Platform Tools</text><text x="0" y="132" class="subtitle-text">The ultimate collection of API clients, BaaS engines, search infrastructure,</text><text x="0" y="160" class="subtitle-text">low-code builders, and API gateways — ranked with transparent pricing and open-source metrics.</text><g><g transform="translate(0, 195) translate(0, 0)"><rect width="180" height="42" fill="#1e293b" fill-opacity=".85" stroke="#334155" stroke-width="1" rx="10"/><text x="90" y="26" class="tag-text" text-anchor="middle">🚀 API Clients</text></g><g transform="translate(0, 195) translate(195, 0)"><rect width="230" height="42" fill="#1e293b" fill-opacity=".85" stroke="#334155" stroke-width="1" rx="10"/><text x="115" y="26" class="tag-text" text-a
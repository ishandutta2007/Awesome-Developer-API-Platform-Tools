<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glowing Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Filter for subtle neon glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e0e7ff;
      }
      
      /* Dynamic Ambient Pulsing */
      @keyframes float-pulse {
        0% { transform: translateY(0px) scale(1); opacity: 0.35; }
        50% { transform: translateY(-12px) scale(1.08); opacity: 0.65; }
        100% { transform: translateY(0px) scale(1); opacity: 0.35; }
      }
      @keyframes particle-drift {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }
      @keyframes radar-sweep {
        0% { r: 50px; opacity: 0.8; }
        100% { r: 320px; opacity: 0; }
      }

      .orb-1 {
        animation: float-pulse 7s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .orb-2 {
        animation: float-pulse 9s ease-in-out infinite 3.5s;
        transform-origin: 1000px 300px;
      }
      .pulse-ring {
        animation: radar-sweep 6s cubic-bezier(0.1, 0.4, 0.2, 1) infinite;
      }
      .pulse-ring-delayed {
        animation: radar-sweep 6s cubic-bezier(0.1, 0.4, 0.2, 1) infinite 3s;
      }
      .flow-line {
        stroke-dasharray: 8 16;
        animation: particle-drift 12s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Ambient Glowing Orbs (in background) -->
  <circle class="orb-1" cx="200" cy="90" r="130" fill="#0284c7" filter="url(#neon-glow)" />
  <circle class="orb-2" cx="1020" cy="330" r="150" fill="#7c3aed" filter="url(#neon-glow)" />

  <!-- Dynamic Circuit / Data Flow Paths (in background) -->
  <path class="flow-line" d="M 0 350 Q 300 280 600 350 T 1200 320" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.3" />
  <path class="flow-line" d="M 0 80 Q 400 140 800 70 T 1200 110" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.25" />

  <!-- Dynamic Radar Wave on the side -->
  <circle class="pulse-ring" cx="1100" cy="100" r="50" fill="none" stroke="#38bdf8" stroke-width="1" />
  <circle class="pulse-ring-delayed" cx="1100" cy="100" r="50" fill="none" stroke="#a855f7" stroke-width="1" />

  <!-- Central Visual Foreground Card to ensure crystal clear readability -->
  <g transform="translate(60, 48)">
    <!-- Header Top Badge -->
    <rect x="0" y="0" width="280" height="34" rx="17" fill="url(#badge-glow)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="140" y="22" text-anchor="middle" class="tag-text" fill="#38bdf8">⚡ CURATED DEVELOPER PLATFORM STACK</text>

    <!-- Main Title (Strictly Foreground) -->
    <text x="0" y="92" class="title-text" fill="url(#title-grad)">Developer API &amp; Platform Tools</text>

    <!-- Subtitle (Strictly Foreground) -->
    <text x="0" y="132" class="subtitle-text">
      The ultimate collection of API clients, BaaS engines, search infrastructure,
    </text>
    <text x="0" y="160" class="subtitle-text">
      low-code builders, and API gateways — ranked with transparent pricing and open-source metrics.
    </text>

    <!-- Feature Tags / Pills -->
    <g transform="translate(0, 195)">
      <!-- Pill 1: API Clients -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="90" y="26" text-anchor="middle" class="tag-text">🚀 API Clients</text>
      </g>
      <!-- Pill 2: Backend-as-a-Service -->
      <g transform="translate(195, 0)">
        <rect width="230" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="115" y="26" text-anchor="middle" class="tag-text">⚡ Backend-as-a-Service</text>
      </g>
      <!-- Pill 3: Search Infrastructure -->
      <g transform="translate(440, 0)">
        <rect width="210" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="105" y="26" text-anchor="middle" class="tag-text">🔍 Search Engines</text>
      </g>
      <!-- Pill 4: Low-Code Platforms -->
      <g transform="translate(665, 0)">
        <rect width="210" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="105" y="26" text-anchor="middle" class="tag-text">🛠️ Low-Code Builders</text>
      </g>
      <!-- Pill 5: API Gateways -->
      <g transform="translate(890, 0)">
        <rect width="190" height="42" rx="10" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
        <text x="95" y="26" text-anchor="middle" class="tag-text">🌐 API Gateways</text>
      </g>
    </g>

    <!-- Bottom Stat Highlights -->
    <g transform="translate(0, 268)">
      <circle cx="10" cy="10" r="5" fill="#10b981" />
      <text x="24" y="14" class="tag-text" fill="#94a3b8">Updated November 2026</text>

      <circle cx="210" cy="10" r="5" fill="#6366f1" />
      <text x="224" y="14" class="tag-text" fill="#94a3b8">20+ Production Open-Source Stacks</text>

      <circle cx="500" cy="10" r="5" fill="#f59e0b" />
      <text x="514" y="14" class="tag-text" fill="#94a3b8">Live GitHub Star Badges</text>

      <circle cx="730" cy="10" r="5" fill="#ec4899" />
      <text x="744" y="14" class="tag-text" fill="#94a3b8">Transparent Pricing &amp; Free Limits</text>
    </g>
  </g>
</svg>
